name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  UMADEV_CI_RUST: "1.97.0"
  UMADEV_CI_NODE: "24.18.0"

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-14
        with:
          toolchain: ${{ env.UMADEV_CI_RUST }}
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-14
        with:
          toolchain: ${{ env.UMADEV_CI_RUST }}
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  docs:
    name: strict rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-14
        with:
          toolchain: ${{ env.UMADEV_CI_RUST }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo doc (all features, warnings denied)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-14
        with:
          toolchain: ${{ env.UMADEV_CI_RUST }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # The process-group / Job-Object teardown tests spawn real child processes
      # and assert on signal delivery, PID-reuse safety, and reap ordering. They
      # are correct and pass reliably when run SERIALLY (as designed), but the
      # default-parallel workspace run below starves them of scheduling under a
      # loaded CI runner and they flake — NOT a logic bug (they pass locally and
      # here at --test-threads=1). Run them serially on EVERY platform (this step
      # used to be Windows-only, which left macos/ubuntu to flake in the parallel
      # run) and EXCLUDE the crate from the parallel run so it is covered exactly
      # once, reliably. umadev-process has no integration/doc tests, so --lib here
      # is its full surface.
      - name: Process-tree teardown (serial, all platforms)
        run: cargo test -p umadev-process --lib --locked -- --test-threads=1
      - name: cargo test
        run: cargo test --workspace --exclude umadev-process --all-features --all-targets --locked --no-fail-fast
      - name: cargo test (doctests)
        run: cargo test --workspace --all-features --doc --locked --no-fail-fast

  grok-source-contract:
    name: audited Grok Build source baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Checkout audited Grok Build source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: xai-org/grok-build
          ref: 500129c714ad1b10e6095481f4a8387a2ec52649
          path: _upstream/grok-build
          fetch-depth: 1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-14
        with:
          toolchain: ${{ env.UMADEV_CI_RUST }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Verify source identity and audited wire markers
        env:
          UMADEV_GROK_SOURCE_DIR: ${{ github.workspace }}/_upstream/grok-build
        run: cargo test -p umadev-host --test grok_source_drift --locked -- --nocapture

  grok-published-contract:
    name: published Grok Build ACP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: grok-0.2.112-linux-x86_64
            sha256: c2867112f7d89366123fe68a55a23dfb027d3602fc5b5b9cd5c080dacb4a2503
            binary: grok
          - os: macos-latest
            artifact: grok-0.2.112-macos-aarch64
            sha256: 5cf05fe670b1818561daf7566b580a5de6b81149166499d61072e49640b541a4
            binary: grok
          - os: windows-latest
            artifact: grok-0.2.112-windows-x86_64.exe
            sha256: 2469bd182af212c7fcb84f2981999e4e8a6a7a2e4172bad3ae7f787a1f11407c
            binary: grok.exe
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-14
        with:
          toolchain: ${{ env.UMADEV_CI_RUST }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.UMADEV_CI_NODE }}
      - name: Install and verify Grok's Linux Plan sandbox prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          # Ubuntu 24.04's default AppArmor user-namespace restriction strips
          # the capabilities bwrap needs to establish its uid map. This is an
          # ephemeral, isolated contract runner; lift that host restriction
          # only for this job, then prove bwrap works.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns >/dev/null
          fi
          # Grok's read-only profile fail-closes before ACP initialize unless
          # this exact mount-namespace primitive can re-exec the agent.
          bwrap --cap-drop ALL --bind / / --dev-bind /dev /dev --proc /proc -- /bin/true
      - name: Download and verify the exact bounded official Grok artifact
        run: >-
          node npm/scripts/grok-published-contract.mjs
          "${{ matrix.artifact }}"
          "${{ matrix.sha256 }}"
          "${{ matrix.binary }}"
      - name: Verify real ACP identity and explicit authentication boundary
        env:
          UMADEV_GROK_PUBLISHED_CONTRACT: "1"
        run: cargo test -p umadev-host --test grok_published_contract --locked -- --nocapture

  kimi-source-contract:
    name: audited Kimi Code source baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Checkout audited Kimi Code source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: MoonshotAI/kimi-code
          ref: 17dfd49768f753a4f0fe97d8e7d3317dab560575
          path: _upstream/kimi-code
          fetch-depth: 1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-14
        with:
          toolchain: ${{ env.UMADEV_CI_RUST }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Verify source identity and audited ACP markers
        env:
          UMADEV_KIMI_SOURCE_DIR: ${{ github.workspace }}/_upstream/kimi-code
        run: cargo test -p umadev-host --test kimi_source_drift --locked -- --nocapture

  kimi-published-contract:
    name: published Kimi Code ACP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-14
        with:
          toolchain: ${{ env.UMADEV_CI_RUST }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"
      - name: Install the exact audited npm package
        run: npm install -g @moonshot-ai/kimi-code@0.31.0
      - name: Verify real ACP identity and terminal-owned authentication
        env:
          KIMI_CODE_HOME: ${{ runner.temp }}/umadev-kimi-code-home
          UMADEV_KIMI_BIN: kimi
          UMADEV_KIMI_PUBLISHED_CONTRACT: "1"
        run: cargo test -p umadev-host --test kimi_published_contract --locked -- --nocapture

  vendor-cli-published-contract:
    name: published vendor CLI contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"
      - name: Install the exact audited Claude Code, Codex, and OpenCode packages
        run: npm install -g @anthropic-ai/claude-code@2.1.216 @openai/codex@0.144.6 opencode-ai@1.18.4
      - name: Verify real published command and permission surfaces
        run: node npm/scripts/vendor-cli-contract.mjs

  terminal-contract:
    name: terminal contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-14
        with:
          toolchain: ${{ env.UMADEV_CI_RUST }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.UMADEV_CI_NODE }}
      - name: Verify native PTY / ConPTY startup, input, and teardown
        run: cargo test -p umadev --test terminal_pty --locked -- --test-threads=1
      - name: Verify deterministic TUI terminal contracts
        run: cargo test -p umadev-tui --lib terminal_contract_ --locked -- --test-threads=1
      - name: Verify cross-platform npm update contracts
        run: node --test npm/scripts/terminal-contract.test.cjs

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-14
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: msrv-1.88
      - name: Verify the declared MSRV
        run: cargo check --workspace --all-targets --locked

  npm-shim:
    name: npm distribution smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-14
        with:
          toolchain: ${{ env.UMADEV_CI_RUST }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.UMADEV_CI_NODE }}
      - name: Verify Cargo, npm, and website versions
        run: node npm/scripts/verify-version-lock.mjs
      - name: Verify npm registry visibility and retry contracts
        run: node --test npm/scripts/publish-registry.test.cjs
      - name: Verify platform binary header contracts
        run: node --test npm/scripts/verify-platform-binaries.test.mjs
      - name: Verify release provenance, tag-only publishing, and native installers
        run: >-
          node --test --test-concurrency=1
          npm/scripts/release-provenance.test.mjs
          npm/scripts/release-manifest.test.mjs
          npm/scripts/grok-published-contract.test.mjs
          npm/scripts/release-workflow-contract.test.mjs
          npm/scripts/native-installer-contract.test.cjs
      - name: Verify launcher, updater, and split-version repair
        run: ./npm/scripts/smoke.sh

  build-release:
    name: build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy, docs, test, grok-source-contract, grok-published-contract, kimi-source-contract, kimi-published-contract, vendor-cli-published-contract, terminal-contract, msrv, npm-shim]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: umadev-linux-x86_64
            ext: ""
          - os: macos-latest
            artifact: umadev-macos-aarch64
            ext: ""
          - os: windows-latest
            artifact: umadev-windows-x86_64
            ext: ".exe"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-14
        with:
          toolchain: ${{ env.UMADEV_CI_RUST }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo build --release
        run: cargo build --release --bin umadev --locked
      # A startup-panic guard: the unit suite never runs the real TUI event loop,
      # so a launch crash (e.g. an eager-evaluated `tokio::select!` branch arg)
      # shipped in 1.0.17/1.0.18 undetected. PTY-launch the built binary and fail
      # if it panics before/at the event loop.
      - name: Launch release smoke test (no startup panic)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$HOME/.umadev"
          printf 'backend = "offline"\nlang = "en"\n' > "$HOME/.umadev/config.toml"
          BIN=target/release/umadev
          OUT=$(timeout 25 script -q -e -c "$BIN" /dev/null < <(sleep 6) 2>&1 || true)
          if printf '%s' "$OUT" | grep -qE 'panicked at'; then
            echo "::error::umadev panicked on release launch"
            printf '%s\n' "$OUT" | tail -60
            exit 1
          fi
      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: target/release/umadev${{ matrix.ext }}
          if-no-files-found: error
