name: Deploy website to GitHub Pages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Keep Pages builds reproducible and off the EOL Node 20 line.
  UMADEV_WEBSITE_NODE: "24.18.0"

concurrency:
  group: github-pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build static website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: umadev-website
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.UMADEV_WEBSITE_NODE }}
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: umadev-website/package-lock.json

      # This workflow is also manually dispatchable for recovery. Refuse a
      # branch or an older tag: otherwise one click can overwrite production
      # Pages with a website that disagrees with GitHub Releases and npm.
      # The release caller reaches this job only after npm publication, so the
      # same gate also prevents out-of-order multi-tag runs from downgrading
      # Pages if their runner scheduling is reversed.
      - name: Require the current public release identity
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./npm/umadev/package.json').version")
          expected_tag="v$version"
          [[ "$GITHUB_REF" == "refs/tags/$expected_tag" \
              && "$GITHUB_REF_NAME" == "$expected_tag" ]] || {
            echo "::error::production Pages may deploy only from $expected_tag, not $GITHUB_REF"
            exit 1
          }

          object=$(timeout --signal=TERM --kill-after=5s 30s \
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$expected_tag")
          type=$(jq -er '.object.type' <<<"$object")
          sha=$(jq -er '.object.sha' <<<"$object")
          for _depth in {1..8}; do
            [[ "$type" == "commit" ]] && break
            [[ "$type" == "tag" ]] || {
              echo "::error::release tag resolves to unsupported Git object type: $type"
              exit 1
            }
            object=$(timeout --signal=TERM --kill-after=5s 30s \
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha")
            type=$(jq -er '.object.type' <<<"$object")
            sha=$(jq -er '.object.sha' <<<"$object")
          done
          [[ "$type" == "commit" && "$sha" == "$GITHUB_SHA" ]] || {
            echo "::error::$expected_tag resolves to $type $sha, website commit is $GITHUB_SHA"
            exit 1
          }

          release=$(timeout --signal=TERM --kill-after=5s 30s \
            gh release view "$expected_tag" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,tagName)
          [[ "$(jq -er '.isDraft' <<<"$release")" == "false" \
              && "$(jq -er '.tagName' <<<"$release")" == "$expected_tag" ]] || {
            echo "::error::$expected_tag is not a public GitHub Release"
            exit 1
          }
          github_latest=$(timeout --signal=TERM --kill-after=5s 30s \
            gh release view --repo "$GITHUB_REPOSITORY" \
              --json tagName --jq '.tagName')
          npm_latest=$(timeout --signal=TERM --kill-after=5s 30s \
            npm view umadev@latest version \
              --registry=https://registry.npmjs.org --prefer-online)
          [[ "$github_latest" == "$expected_tag" && "$npm_latest" == "$version" ]] || {
            echo "::error::public release surfaces moved: GitHub=$github_latest npm=$npm_latest expected=$version"
            exit 1
          }

      - name: Verify release version lock
        working-directory: ${{ github.workspace }}
        run: node npm/scripts/verify-version-lock.mjs

      - name: Install dependencies
        run: npm ci

      - name: Audit all website dependencies
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org

      - name: Lint
        run: npm run lint

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          GITHUB_PAGES_REPO: umadev
          GITHUB_PAGES_DOMAIN: umadev.goder.ai
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: umadev-website/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
