name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pin the release builders themselves. A tag retry months later must compile
  # with the same Rust/Node toolchains instead of whatever `stable`/`20` means
  # on that future date. Node 20 is EOL as of 2026-03-24; use the current LTS.
  UMADEV_RELEASE_RUST: "1.97.0"
  UMADEV_RELEASE_NODE: "24.18.0"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  # A release tag must pass the same source and distribution checks as an
  # ordinary pull request. The artifact build and every publish job wait for
  # this gate plus the macOS/Windows release-test matrix.
  quality:
    name: release quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-14
        with:
          toolchain: ${{ env.UMADEV_RELEASE_RUST }}
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.UMADEV_RELEASE_NODE }}
          registry-url: "https://registry.npmjs.org"
      - name: Install Windows GNU C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-mingw-w64-x86-64

      - name: Checkout audited Grok Build source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: xai-org/grok-build
          ref: 500129c714ad1b10e6095481f4a8387a2ec52649
          path: _upstream/grok-build
          fetch-depth: 1

      - name: Checkout audited Kimi Code source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: MoonshotAI/kimi-code
          ref: 17dfd49768f753a4f0fe97d8e7d3317dab560575
          path: _upstream/kimi-code
          fetch-depth: 1

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Windows GNU cross-check
        run: cargo clippy --workspace --all-targets --all-features --locked --target x86_64-pc-windows-gnu -- -D warnings

      # Keep the release gate identical to the ordinary CI contract. These
      # real process-tree tests are timing-sensitive under a loaded parallel
      # runner, so CI covers the crate serially and excludes it from the
      # parallel workspace invocation.
      - name: Process-tree teardown (serial)
        run: cargo test -p umadev-process --lib --locked -- --test-threads=1

      - name: cargo test
        run: cargo test --workspace --exclude umadev-process --all-features --all-targets --locked --no-fail-fast

      - name: cargo test (doctests)
        run: cargo test --workspace --all-features --doc --locked --no-fail-fast

      - name: Verify audited Grok Build source baseline
        env:
          UMADEV_GROK_SOURCE_DIR: ${{ github.workspace }}/_upstream/grok-build
        run: cargo test -p umadev-host --test grok_source_drift --locked -- --nocapture

      - name: Verify audited Kimi Code source baseline
        env:
          UMADEV_KIMI_SOURCE_DIR: ${{ github.workspace }}/_upstream/kimi-code
        run: cargo test -p umadev-host --test kimi_source_drift --locked -- --nocapture

      - name: Verify cross-platform npm update contracts
        run: node --test npm/scripts/terminal-contract.test.cjs

      - name: Verify launcher command classification
        run: node --test npm/scripts/cli-classification.test.cjs

      - name: Verify npm registry visibility and retry contracts
        run: node --test npm/scripts/publish-registry.test.cjs

      - name: Verify platform binary header contracts
        run: node --test npm/scripts/verify-platform-binaries.test.mjs

      - name: Verify release provenance, tag-only publishing, and native installers
        run: >-
          node --test --test-concurrency=1
          npm/scripts/release-provenance.test.mjs
          npm/scripts/release-manifest.test.mjs
          npm/scripts/grok-published-contract.test.mjs
          npm/scripts/release-workflow-contract.test.mjs
          npm/scripts/native-installer-contract.test.cjs

      - name: strict rustdoc (all features)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Verify Cargo, npm, website, and tag versions
        run: node npm/scripts/verify-version-lock.mjs

      - name: Verify npm launcher, updater, and split-version repair
        run: ./npm/scripts/smoke.sh

      - name: Install website dependencies from the exact lockfile
        run: npm --prefix umadev-website ci

      - name: Audit all website dependencies
        run: npm --prefix umadev-website audit --audit-level=moderate --registry=https://registry.npmjs.org

      - name: Lint website
        run: npm --prefix umadev-website run lint

      - name: Build website before any package can be published
        env:
          GITHUB_PAGES: "true"
          GITHUB_PAGES_REPO: umadev
          GITHUB_PAGES_DOMAIN: umadev.goder.ai
        run: npm --prefix umadev-website run build

  grok-published-contract:
    name: release Grok Build ACP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: grok-0.2.112-linux-x86_64
            sha256: c2867112f7d89366123fe68a55a23dfb027d3602fc5b5b9cd5c080dacb4a2503
            binary: grok
          - os: macos-latest
            artifact: grok-0.2.112-macos-aarch64
            sha256: 5cf05fe670b1818561daf7566b580a5de6b81149166499d61072e49640b541a4
            binary: grok
          - os: windows-latest
            artifact: grok-0.2.112-windows-x86_64.exe
            sha256: 2469bd182af212c7fcb84f2981999e4e8a6a7a2e4172bad3ae7f787a1f11407c
            binary: grok.exe
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-14
        with:
          toolchain: ${{ env.UMADEV_RELEASE_RUST }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.UMADEV_RELEASE_NODE }}
      - name: Install and verify Grok's Linux Plan sandbox prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          # Ubuntu 24.04's default AppArmor user-namespace restriction strips
          # the capabilities bwrap needs to establish its uid map. This is an
          # ephemeral, isolated contract runner; lift that host restriction
          # only for this job, then prove bwrap works.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns >/dev/null
          fi
          # Grok's read-only profile fail-closes before ACP initialize unless
          # this exact mount-namespace primitive can re-exec the agent.
          bwrap --cap-drop ALL --bind / / --dev-bind /dev /dev --proc /proc -- /bin/true
      - name: Download and verify the exact bounded official Grok artifact
        run: >-
          node npm/scripts/grok-published-contract.mjs
          "${{ matrix.artifact }}"
          "${{ matrix.sha256 }}"
          "${{ matrix.binary }}"
      - name: Verify real ACP identity and explicit authentication boundary
        env:
          UMADEV_GROK_PUBLISHED_CONTRACT: "1"
        run: cargo test -p umadev-host --test grok_published_contract --locked -- --nocapture

  kimi-published-contract:
    name: release Kimi Code ACP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-14
        with:
          toolchain: ${{ env.UMADEV_RELEASE_RUST }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"
      - name: Install the exact audited npm package
        run: npm install -g @moonshot-ai/kimi-code@0.31.0
      - name: Verify real ACP identity and terminal-owned authentication
        env:
          KIMI_CODE_HOME: ${{ runner.temp }}/umadev-kimi-code-home
          UMADEV_KIMI_BIN: kimi
          UMADEV_KIMI_PUBLISHED_CONTRACT: "1"
        run: cargo test -p umadev-host --test kimi_published_contract --locked -- --nocapture

  vendor-cli-published-contract:
    name: release vendor CLI contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"
      - name: Install the exact audited Claude Code, Codex, and OpenCode packages
        run: npm install -g @anthropic-ai/claude-code@2.1.216 @openai/codex@0.144.6 opencode-ai@1.18.4
      - name: Verify real published command and permission surfaces
        run: node npm/scripts/vendor-cli-contract.mjs

  release-credentials:
    name: release credentials gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      # Pages rejects a tag deployment before the reusable workflow can run if
      # the environment has no matching tag policy. Check that public setting
      # before GitHub assets or npm packages can become visible, so a policy
      # regression cannot create a half-published release.
      - name: Require GitHub Pages to allow this release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          policy_patterns=$(mktemp)
          trap 'rm -f "$policy_patterns"' EXIT
          page=1
          seen=0
          total=0
          while :; do
            policies=$(curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 60 \
              --max-redirs 5 --proto '=https' --proto-redir '=https' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/environments/github-pages/deployment-branch-policies?per_page=100&page=$page")
            total=$(jq -er '.total_count | numbers' <<<"$policies")
            returned=$(jq -er '.branch_policies | length' <<<"$policies")
            jq -r '.branch_policies[] | select(.type == "tag") | .name' \
              <<<"$policies" >> "$policy_patterns"
            seen=$((seen + returned))
            (( seen >= total )) && break
            (( returned > 0 )) || {
              echo "::error::deployment policy pagination ended after $seen of $total entries"
              exit 1
            }
            page=$((page + 1))
            (( page <= 100 )) || {
              echo "::error::deployment policy pagination exceeded 100 pages"
              exit 1
            }
          done
          allowed=false
          while IFS= read -r pattern; do
            if [[ "$RELEASE_TAG" == $pattern ]]; then
              allowed=true
              break
            fi
          done < "$policy_patterns"
          if [[ "$allowed" != true ]]; then
            echo "::error::github-pages has no tag deployment policy matching $RELEASE_TAG"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          node-version: ${{ env.UMADEV_RELEASE_NODE }}
          registry-url: "https://registry.npmjs.org"
      # npm is always part of a tagged release. Check its credential before any
      # platform build can start, so a missing token can never leave a public
      # GitHub Release behind with npm still on the previous version.
      - name: Require npm publishing credential for tags
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NPM_TOKEN:-}" ]]; then
            echo '::error::missing required release secret: NPM_TOKEN'
            exit 1
          fi
          identity=$(npm whoami --registry=https://registry.npmjs.org)
          if [[ -z "$identity" ]]; then
            echo '::error::npm accepted the credential but returned no registry identity'
            exit 1
          fi

      # Native signing remains optional. Once SIGN_RELEASE=true, all platform
      # signing/notarization credentials become a fail-closed release gate.
      - name: Require native signing credentials for tags
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.SIGN_RELEASE == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          required=(
            APPLE_CERTIFICATE_P12_BASE64
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_ID
            APPLE_TEAM_ID
            APPLE_APP_SPECIFIC_PASSWORD
            WINDOWS_CERTIFICATE_PFX_BASE64
            WINDOWS_CERTIFICATE_PASSWORD
          )
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::missing required release secret: %s\n' "${missing[@]}"
            exit 1
          fi
          if [[ "$APPLE_SIGNING_IDENTITY" != "Developer ID Application:"* ]]; then
            echo '::error::APPLE_SIGNING_IDENTITY must name a Developer ID Application certificate'
            exit 1
          fi

  msrv:
    name: release MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-14
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-msrv-1.88
      - name: Verify the declared MSRV
        run: cargo check --workspace --all-targets --locked

  rustsec:
    name: release RustSec audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Audit the exact release lockfile
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  platform-tests:
    name: release tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-14
        with:
          toolchain: ${{ env.UMADEV_RELEASE_RUST }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.UMADEV_RELEASE_NODE }}
      - name: Process-tree teardown (serial, all platforms)
        run: cargo test -p umadev-process --lib --locked -- --test-threads=1
      - name: cargo test
        run: cargo test --workspace --exclude umadev-process --all-features --all-targets --locked --no-fail-fast
      - name: cargo test (doctests)
        run: cargo test --workspace --all-features --doc --locked --no-fail-fast
      - name: Verify deterministic TUI terminal contracts
        run: cargo test -p umadev-tui --lib terminal_contract_ --locked -- --test-threads=1
      - name: Verify native PTY / ConPTY startup, input, and teardown
        run: cargo test -p umadev --test terminal_pty --locked -- --test-threads=1
      - name: Verify cross-platform npm update contracts
        run: node --test npm/scripts/terminal-contract.test.cjs

  build:
    name: build (${{ matrix.target }})
    needs: [quality, grok-published-contract, kimi-published-contract, vendor-cli-published-contract, release-credentials, msrv, rustsec, platform-tests]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build BOTH linux-gnu targets through `cross`, whose images are
          # Ubuntu 20.04-based (glibc 2.31), so the shipped binaries run on any
          # glibc >= 2.31. A plain `cargo build` on ubuntu-latest links against
          # the runner's glibc (2.39 on Ubuntu 24.04), which fails on common
          # distros (RHEL/Rocky 9, Ubuntu 22.04, etc.) with `GLIBC_2.39 not
          # found`. cross is already proven here with --features vector-local
          # (candle + esaxx C++) for aarch64, so x86_64 rides the same path.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            npm_platform: linux-x64
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            npm_platform: linux-arm64
            cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            npm_platform: linux-musl-x64
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            npm_platform: linux-musl-arm64
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
            npm_platform: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
            npm_platform: darwin-x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            npm_platform: win32-x64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Verify release tag matches the source version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          source_version=$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$source_version" || {
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo version v$source_version"
            exit 1
          }
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-14
        with:
          toolchain: ${{ env.UMADEV_RELEASE_RUST }}
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.UMADEV_RELEASE_NODE }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Every Linux target builds via `cross`: GNU uses its old glibc sysroot,
      # while musl produces the Alpine-compatible static-libc variants. Pinning
      # keeps both toolchains reproducible.
      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --version 0.2.5 --locked

      # --features vector-local bundles the candle local-embedding backend. The
      # model remains a separately verified Release asset: npm provisions it on
      # demand, while native installs may point UMADEV_EMBED_MODEL_DIR at it.
      # candle is pure Rust on CPU and cross-compiles to every target here.
      - name: Build (cargo)
        if: matrix.cross != true
        run: cargo build --release --bin umadev --features vector-local --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --bin umadev --features vector-local --locked --target ${{ matrix.target }}

      - name: Developer ID sign and notarize (macOS)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(matrix.target, 'apple-darwin') && vars.SIGN_RELEASE == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/umadev"
          certificate="$RUNNER_TEMP/umadev-developer-id.p12"
          keychain="$RUNNER_TEMP/umadev-signing.keychain-db"
          archive="$RUNNER_TEMP/umadev-${{ matrix.target }}.zip"
          keychain_password="$(uuidgen)$(uuidgen)"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$certificate" "$archive"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain"

          codesign --force --options runtime --timestamp \
            --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          codesign --display --verbose=4 "$binary"

          ditto -c -k --keepParent "$binary" "$archive"
          xcrun notarytool submit "$archive" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          spctl --assess --type execute --verbose=4 "$binary"

      - name: Authenticode sign and timestamp (Windows)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(matrix.target, 'windows-msvc') && vars.SIGN_RELEASE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = "target/${{ matrix.target }}/release/umadev.exe"
          $certificate = Join-Path $env:RUNNER_TEMP 'umadev-authenticode.pfx'
          try {
            [IO.File]::WriteAllBytes(
              $certificate,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
            )
            $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $signTool = Get-ChildItem -Path $sdkRoot -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) {
              throw 'signtool.exe was not found in the Windows SDK'
            }

            $signArgs = @(
              'sign', '/fd', 'SHA256', '/td', 'SHA256',
              '/tr', 'http://timestamp.digicert.com',
              '/f', $certificate,
              '/p', $env:WINDOWS_CERTIFICATE_PASSWORD,
              '/d', 'UmaDev',
              '/du', 'https://github.com/umacloud/umadev',
              $binary
            )
            & $signTool.FullName @signArgs
            if ($LASTEXITCODE -ne 0) {
              throw "signtool sign failed with exit code $LASTEXITCODE"
            }
            & $signTool.FullName verify /pa /v $binary
            if ($LASTEXITCODE -ne 0) {
              throw "signtool verify failed with exit code $LASTEXITCODE"
            }
            $signature = Get-AuthenticodeSignature -FilePath $binary
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode status is $($signature.Status)"
            }
          }
          finally {
            Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
          }

      # Self-verify the glibc floor: a linux binary that requires a symbol
      # newer than GLIBC_2.31 would break older distros (the GLIBC_2.39 report
      # that motivated the cross switch). Built inside cross's Ubuntu 20.04
      # image nothing should exceed 2.31 — fail the release loudly if it does,
      # so this can never silently regress. objdump on the runner parses the
      # ELF symbol table regardless of arch or the runner's own glibc.
      - name: Verify glibc floor (linux)
        if: contains(matrix.target, 'linux-gnu')
        run: |
          bin="target/${{ matrix.target }}/release/umadev"
          max=$(objdump -T "$bin" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "highest required glibc symbol: ${max:-none}"
          if [ -n "$max" ] && [ "$(printf '%s\nGLIBC_2.31\n' "$max" | sort -V | tail -1)" != "GLIBC_2.31" ]; then
            echo "::error::$bin requires $max (> GLIBC_2.31) — would break glibc 2.31–2.34 systems"
            exit 1
          fi

      - name: Verify musl binary is libc-self-contained
        if: contains(matrix.target, 'linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/umadev"
          if readelf -l "$bin" | grep -q 'Requesting program interpreter'; then
            echo "::error::$bin is dynamically linked and may not start on a clean Alpine host"
            readelf -l "$bin" | grep 'Requesting program interpreter' || true
            exit 1
          fi
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-musl" ]]; then
            "$bin" --version
          fi

      - name: Stage binary into dist/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          asset="dist/umadev-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/umadev${{ matrix.ext }}" "$asset"
          # Publish a per-binary integrity sidecar. The standalone updater
          # requires this exact `SHA256  filename` contract before replacing an
          # installed executable; a release missing it is refused.
          node - "$asset" <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const file = process.argv[2];
          const hash = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          fs.writeFileSync(`${file}.sha256`, `${hash}  ${path.basename(file)}\n`);
          NODE

      - name: Stage tag-bound npm sub-package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          UMADEV_RELEASE_TAG: ${{ github.ref_name }}
          UMADEV_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./npm/scripts/stage.sh "${{ matrix.npm_platform }}" \
            "target/${{ matrix.target }}/release/umadev${{ matrix.ext }}"

      - name: Verify native binary version when runnable
        shell: bash
        run: |
          set -euo pipefail
          source_version=$(node -p "require('./npm/umadev/package.json').version")
          host_platform="$(node -p "process.platform + '-' + process.arch")"
          if [ "$host_platform" = "${{ matrix.npm_platform }}" ]; then
            actual=$("dist/umadev-${{ matrix.target }}${{ matrix.ext }}" --version)
            case "$actual" in
              *"$source_version"*) ;;
              *) echo "::error::native binary reported '$actual', expected $source_version"; exit 1 ;;
            esac
          else
            echo "cross-architecture artifact: runtime smoke deferred ($host_platform)"
          fi

      - name: Verify tag-bound npm binary provenance
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          source_version=$(node -p "require('./npm/umadev/package.json').version")
          package_version=$(node -p "require('./npm/cli-${{ matrix.npm_platform }}/package.json').version")
          test "$package_version" = "$source_version" || {
            echo "::error::platform package $package_version != main package $source_version"
            exit 1
          }

          node - \
            "dist/umadev-${{ matrix.target }}${{ matrix.ext }}" \
              "npm/cli-${{ matrix.npm_platform }}/bin/umadev${{ matrix.ext }}" <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const digest = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          if (digest(process.argv[2]) !== digest(process.argv[3])) {
            throw new Error('the npm binary differs from the GitHub Release binary');
          }
          NODE
          node npm/scripts/release-provenance.mjs verify-one \
            npm "${{ matrix.npm_platform }}" "$source_version" \
            "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Attest binary provenance
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/umadev-${{ matrix.target }}${{ matrix.ext }}

      - name: Upload binary (GitHub Releases artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: umadev-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Upload staged npm sub-package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-${{ matrix.npm_platform }}
          path: npm/cli-${{ matrix.npm_platform }}/
          if-no-files-found: error

  dispatch-validation:
    name: workflow dispatch completed (validation only)
    needs: [build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirm no production surface was invoked
        run: |
          echo "workflow_dispatch completed validation and build checks only."
          echo "GitHub Release, npm, signing, attestation, and website deployment require a pushed v* tag."

  publish-github:
    name: publish github release
    needs: [quality, platform-tests, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.UMADEV_RELEASE_NODE }}
          registry-url: "https://registry.npmjs.org"
      - name: Wait for the immediately preceding public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target=$(node -p "require('./npm/umadev/package.json').version")
          mapfile -t stable_versions < <(
            sed -n 's/^## \[\([0-9][0-9.]*\)\].*/\1/p' CHANGELOG.md
          )
          test "${stable_versions[0]:-}" = "$target" || {
            echo "::error::CHANGELOG does not lead with release $target"
            exit 1
          }
          previous="${stable_versions[1]:-}"
          if [[ -z "$previous" ]]; then
            echo "No preceding stable release is recorded; treating $target as the first release."
            exit 0
          fi

          ready=false
          for attempt in {1..120}; do
            github_latest=$(timeout --signal=TERM --kill-after=5s 30s \
              gh release view --repo "$GITHUB_REPOSITORY" \
                --json tagName --jq '.tagName' 2>/dev/null || true)
            npm_latest=$(timeout --signal=TERM --kill-after=5s 30s \
              npm view umadev@latest version \
                --registry=https://registry.npmjs.org --prefer-online 2>/dev/null || true)

            github_allowed=false
            npm_allowed=false
            [[ "$github_latest" == "v$previous" || "$github_latest" == "v$target" ]] \
              && github_allowed=true
            [[ "$npm_latest" == "$previous" || "$npm_latest" == "$target" ]] \
              && npm_allowed=true
            if [[ "$github_allowed" == true && "$npm_allowed" == true ]]; then
              ready=true
              break
            fi
            if (( attempt < 120 )); then
              echo "Waiting for v$previous before v$target (GitHub=${github_latest:-missing}, npm=${npm_latest:-missing})"
              sleep 10
            fi
          done
          [[ "$ready" == true ]] || {
            echo "::error::release order blocked: v$target requires GitHub/npm to be at v$previous (or v$target for an idempotent retry), got GitHub=${github_latest:-missing}, npm=${npm_latest:-missing}"
            exit 1
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
          pattern: umadev-*
      - name: Prepare SBOM output directory
        run: mkdir -p sbom
      - name: Generate release SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom/umadev-${{ github.ref_name }}.spdx.json
          artifact-name: umadev-${{ github.ref_name }}.spdx.json
          syft-version: v1.46.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - name: Verify and attest the release SBOM
        run: |
          set -euo pipefail
          file="umadev-${GITHUB_REF_NAME}.spdx.json"
          test -s "sbom/$file"
          (cd sbom && sha256sum "$file" > "$file.sha256" && sha256sum -c "$file.sha256")
      - name: Attest release SBOM provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: sbom/*
      - name: Verify binary artifact set and checksums
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const expected = [
            'umadev-aarch64-apple-darwin',
            'umadev-aarch64-unknown-linux-gnu',
            'umadev-aarch64-unknown-linux-musl',
            'umadev-x86_64-apple-darwin',
            'umadev-x86_64-pc-windows-msvc.exe',
            'umadev-x86_64-unknown-linux-gnu',
            'umadev-x86_64-unknown-linux-musl',
          ];
          const binaries = fs.readdirSync('dist')
            .filter((name) => !name.endsWith('.sha256'))
            .sort();
          if (JSON.stringify(binaries) !== JSON.stringify(expected)) {
            throw new Error(`release binary set mismatch: ${binaries.join(', ')}`);
          }
          for (const name of binaries) {
            const file = path.join('dist', name);
            const sidecar = `${file}.sha256`;
            if (!fs.existsSync(sidecar)) throw new Error(`missing ${sidecar}`);
            const expected = fs.readFileSync(sidecar, 'utf8').trim().split(/\s+/)[0];
            const actual = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if (actual !== expected) throw new Error(`checksum mismatch for ${name}`);
          }
          console.log('verified 7 release binaries and checksum sidecars');
          NODE
      # The fp16 embedding model is too large for npm (~224MB > npm's limit), so
      # it ships as a GitHub Release ASSET. The umadev npm wrapper (bin/cli.js)
      # downloads it on first launch into ~/.umadev/embed-model — auto-installed,
      # then fully local. Fetch + quantize f32→f16 here so the assets exist.
      - name: Fetch + quantize embedding model (f16) for the Release
        run: |
          set -euo pipefail
          mkdir -p model
          # Immutable upstream revision. Never build a release from mutable
          # `main`: the same UmaDev tag must always start from the same model.
          MODEL_REV=614241f622f53c4eeff9890bdc4f31cfecc418b3
          BASE="https://huggingface.co/intfloat/multilingual-e5-small/resolve/$MODEL_REV"
          # Hashes below bind the bytes; these transport bounds additionally
          # ensure a stalled/oversized upstream cannot hang or fill the runner.
          download_model() {
            local url="$1" output="$2" max_bytes="$3" max_time="$4" actual_bytes
            curl --fail --location --silent --show-error \
              --retry 5 --retry-delay 15 --retry-all-errors \
              --connect-timeout 20 --max-time "$max_time" \
              --retry-max-time "$max_time" --max-redirs 10 \
              --max-filesize "$max_bytes" \
              --proto '=https' --proto-redir '=https' \
              "$url" --output "$output"
            actual_bytes=$(wc -c < "$output" | tr -d '[:space:]')
            (( actual_bytes <= max_bytes )) || {
              echo "::error::$output exceeded $max_bytes bytes"
              rm -f "$output"
              return 1
            }
          }
          download_model "$BASE/config.json" model/config.json 1048576 60
          download_model "$BASE/tokenizer.json" model/tokenizer.json 67108864 300
          download_model "$BASE/model.safetensors" model/model.f32.safetensors 536870912 900
          # Verify the immutable upstream bytes, not only the files produced by
          # this run. The model hash is the Git-LFS object oid at MODEL_REV.
          printf '%s  %s\n' \
            '69137736cab8b8903a07fe8afaafdda25aac55415a12a55d1bffa9f581abf959' \
            'model/config.json' \
            '0b44a9d7b51c3c62626640cda0e2c2f70fdacdc25bbbd68038369d14ebdf4c39' \
            'model/tokenizer.json' \
            '1a55775f53449dac10a2bcbc312469fac40b96d53198c407081a831f81c98477' \
            'model/model.f32.safetensors' | sha256sum -c -
          python3 -m pip install --quiet safetensors==0.5.3 numpy==2.2.6
          python3 npm/scripts/quantize-model.py model/model.f32.safetensors model/model.safetensors
          rm -f model/model.f32.safetensors
          (cd model && for file in config.json tokenizer.json model.safetensors; do
            sha256sum "$file" > "$file.sha256"
          done)
          (cd model && sha256sum -c config.json.sha256 tokenizer.json.sha256 model.safetensors.sha256)
          ls -la model
      - name: Attest embedding model provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: model/*
      - name: Create tag and commit bound release manifest
        run: |
          set -euo pipefail
          mkdir -p release-manifest
          node npm/scripts/release-manifest.mjs create \
            release-manifest/umadev-release-manifest.json \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" \
            dist/umadev-x86_64-unknown-linux-gnu \
            dist/umadev-x86_64-unknown-linux-gnu.sha256 \
            dist/umadev-aarch64-unknown-linux-gnu \
            dist/umadev-aarch64-unknown-linux-gnu.sha256 \
            dist/umadev-x86_64-unknown-linux-musl \
            dist/umadev-x86_64-unknown-linux-musl.sha256 \
            dist/umadev-aarch64-unknown-linux-musl \
            dist/umadev-aarch64-unknown-linux-musl.sha256 \
            dist/umadev-aarch64-apple-darwin \
            dist/umadev-aarch64-apple-darwin.sha256 \
            dist/umadev-x86_64-apple-darwin \
            dist/umadev-x86_64-apple-darwin.sha256 \
            dist/umadev-x86_64-pc-windows-msvc.exe \
            dist/umadev-x86_64-pc-windows-msvc.exe.sha256 \
            model/config.json model/config.json.sha256 \
            model/tokenizer.json model/tokenizer.json.sha256 \
            model/model.safetensors model/model.safetensors.sha256 \
            sbom/umadev-${GITHUB_REF_NAME}.spdx.json \
            sbom/umadev-${GITHUB_REF_NAME}.spdx.json.sha256
          (
            cd release-manifest
            sha256sum umadev-release-manifest.json > umadev-release-manifest.json.sha256
            sha256sum -c umadev-release-manifest.json.sha256
          )
      - name: Attest release manifest provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: release-manifest/*
      # Keep a new Release private until every asset has uploaded and its bytes
      # match the locally verified set. If a retry sees an already-public
      # Release, it is treated as immutable: identical content is a no-op, while
      # a partial or different Release fails instead of silently rewriting what
      # users may already have downloaded.
      - name: Publish complete GitHub Release atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_files=(
            dist/umadev-x86_64-unknown-linux-gnu
            dist/umadev-x86_64-unknown-linux-gnu.sha256
            dist/umadev-aarch64-unknown-linux-gnu
            dist/umadev-aarch64-unknown-linux-gnu.sha256
            dist/umadev-x86_64-unknown-linux-musl
            dist/umadev-x86_64-unknown-linux-musl.sha256
            dist/umadev-aarch64-unknown-linux-musl
            dist/umadev-aarch64-unknown-linux-musl.sha256
            dist/umadev-aarch64-apple-darwin
            dist/umadev-aarch64-apple-darwin.sha256
            dist/umadev-x86_64-apple-darwin
            dist/umadev-x86_64-apple-darwin.sha256
            dist/umadev-x86_64-pc-windows-msvc.exe
            dist/umadev-x86_64-pc-windows-msvc.exe.sha256
            model/config.json
            model/config.json.sha256
            model/tokenizer.json
            model/tokenizer.json.sha256
            model/model.safetensors
            model/model.safetensors.sha256
            sbom/umadev-${GITHUB_REF_NAME}.spdx.json
            sbom/umadev-${GITHUB_REF_NAME}.spdx.json.sha256
            release-manifest/umadev-release-manifest.json
            release-manifest/umadev-release-manifest.json.sha256
          )

          for file in "${release_files[@]}"; do
            test -f "$file" || {
              echo "::error::local Release asset is missing: $file"
              exit 1
            }
          done

          assert_remote_tag_commit() {
            local object type sha
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
            type=$(jq -er '.object.type' <<<"$object")
            sha=$(jq -er '.object.sha' <<<"$object")
            for _depth in {1..8}; do
              [[ "$type" == "commit" ]] && break
              [[ "$type" == "tag" ]] || {
                echo "::error::release tag resolves to unsupported Git object type: $type"
                exit 1
              }
              object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha")
              type=$(jq -er '.object.type' <<<"$object")
              sha=$(jq -er '.object.sha' <<<"$object")
            done
            [[ "$type" == "commit" && "$sha" == "$GITHUB_SHA" ]] || {
              echo "::error::release tag moved: $GITHUB_REF_NAME resolves to $type $sha, workflow commit is $GITHUB_SHA"
              exit 1
            }
          }
          # Check both before touching a draft and immediately before making it
          # public. A force-moved tag must never publish bytes built from the old
          # workflow commit under the new public tag identity.
          assert_remote_tag_commit

          state=missing
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            state=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq 'if .isDraft then "draft" else "published" end')
          fi

          if [[ "$state" == "missing" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --generate-notes \
              --verify-tag
            state=draft
          fi

          if [[ "$state" == "draft" ]]; then
            # A failed earlier attempt may have left extra or stale assets on
            # the hidden draft. Clear them first so every retry reconstructs
            # the same manifest instead of preserving an unpublishable draft.
            #
            # Enumerate + delete assets through `gh release` (which resolves a
            # DRAFT by its tag), NOT the REST `/releases/tags/{tag}` endpoint,
            # which only ever returns PUBLISHED releases and 404s on a draft —
            # aborting the very first publish, since the release is a draft when
            # this runs.
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | while read -r asset_name; do
                [[ -z "$asset_name" ]] || gh release delete-asset \
                  "$GITHUB_REF_NAME" "$asset_name" \
                  --repo "$GITHUB_REPOSITORY" --yes
              done
            gh release upload "$GITHUB_REF_NAME" "${release_files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          fi

          expected_names=$(printf '%s\n' "${release_files[@]##*/}" | sort)
          actual_names=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | sort)
          if [[ "$actual_names" != "$expected_names" ]]; then
            echo "::error::GitHub Release asset set differs from the verified release manifest"
            diff -u <(printf '%s\n' "$expected_names") <(printf '%s\n' "$actual_names") || true
            exit 1
          fi

          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$verify_dir"
          node npm/scripts/release-manifest.mjs verify \
            "$verify_dir/umadev-release-manifest.json" \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$verify_dir"
          if [[ "$state" == "draft" ]]; then
            for file in "${release_files[@]}"; do
              remote="$verify_dir/$(basename "$file")"
              cmp -s "$file" "$remote" || {
                echo "::error::uploaded draft asset bytes differ: $(basename "$file")"
                exit 1
              }
            done
          else
            # Signed binaries and SPDX creation metadata are intentionally not
            # byte-reproducible across a workflow rerun. Once a release is public,
            # treat its exact remote manifest as immutable and verify each remote
            # file against its already-published checksum instead of comparing it
            # with newly rebuilt bytes. The npm job below stages these same remote
            # binaries, so a retry cannot split GitHub and npm artifacts.
            (
              cd "$verify_dir"
              for checksum in *.sha256; do
                sha256sum -c "$checksum"
              done
            )
          fi

          chmod +x "$verify_dir/umadev-x86_64-unknown-linux-gnu"
          if ! reported=$(timeout --signal=TERM --kill-after=2s 10s \
            "$verify_dir/umadev-x86_64-unknown-linux-gnu" --version); then
            echo "::error::published Linux binary --version failed or timed out"
            exit 1
          fi
          test "${reported,,}" = "umadev ${GITHUB_REF_NAME#v}" || {
            echo "::error::published Linux binary reports '$reported', expected UmaDev ${GITHUB_REF_NAME#v}"
            exit 1
          }

          if [[ "$state" == "draft" ]]; then
            assert_remote_tag_commit
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --latest
          fi

          published_state=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft')
          test "$published_state" = "false" || {
            echo "::error::GitHub Release remained a draft after verification"
            exit 1
          }

  publish-npm:
    name: publish to npm
    # The npm launcher fetches this exact version's model from GitHub Releases.
    # Never expose the main npm package until those assets are verified public.
    needs: [build, publish-github]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.UMADEV_RELEASE_NODE }}
          registry-url: "https://registry.npmjs.org"

      # GitHub Release is the canonical byte source for npm, including a rerun
      # after GitHub succeeded but npm failed. Rebuilding a signed binary or SBOM
      # is not byte-reproducible, so never publish a retry's rebuilt binary beside
      # the already-public release asset.
      - name: Stage npm binaries from the verified public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          UMADEV_RELEASE_TAG: ${{ github.ref_name }}
          UMADEV_RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets
          node npm/scripts/release-manifest.mjs verify \
            release-assets/umadev-release-manifest.json \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" release-assets
          (
            cd release-assets
            for checksum in *.sha256; do
              sha256sum -c "$checksum"
            done
          )
          while read -r platform asset; do
            test -f "release-assets/$asset" || {
              echo "::error::public GitHub Release is missing $asset"
              exit 1
            }
            ./npm/scripts/stage.sh "$platform" "release-assets/$asset"
          done <<'ASSETS'
          darwin-arm64 umadev-aarch64-apple-darwin
          darwin-x64 umadev-x86_64-apple-darwin
          linux-x64 umadev-x86_64-unknown-linux-gnu
          linux-arm64 umadev-aarch64-unknown-linux-gnu
          linux-musl-x64 umadev-x86_64-unknown-linux-musl
          linux-musl-arm64 umadev-aarch64-unknown-linux-musl
          win32-x64 umadev-x86_64-pc-windows-msvc.exe
          ASSETS

      - name: Verify every npm binary matches its OS, CPU, and libc package
        run: node npm/scripts/verify-platform-binaries.mjs

      - name: Verify every npm binary matches this tag and commit
        run: |
          version=$(node -p "require('./npm/umadev/package.json').version")
          node npm/scripts/release-provenance.mjs verify \
            npm "$version" "$GITHUB_REF_NAME" "$GITHUB_SHA"

      # NOTE: the embedding model is NO LONGER published to npm — it's too large
      # (~224MB > npm's limit, which returned 413). It now ships as a GitHub
      # Release asset (see the release job) and is fetched on first launch by
      # bin/cli.js. publish.sh therefore skips the model package.
      - name: npm publish (platforms + main)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: ./npm/scripts/publish.sh

  deploy-website:
    name: deploy website from release tag
    needs: [publish-npm]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website-pages.yml

  verify-publication:
    name: verify github, npm, and website publication
    needs: [publish-github, publish-npm, deploy-website]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.UMADEV_RELEASE_NODE }}
      - name: Verify every public release surface
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          packages=(
            umadev
            @umacloud/cli-darwin-arm64
            @umacloud/cli-darwin-x64
            @umacloud/cli-linux-x64
            @umacloud/cli-linux-arm64
            @umacloud/cli-linux-musl-x64
            @umacloud/cli-linux-musl-arm64
            @umacloud/cli-win32-x64
            @umacloud/knowledge
          )

          release=$(timeout --signal=TERM --kill-after=5s 30s \
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,assets)
          test "$(jq -r '.isDraft' <<<"$release")" = "false"
          test "$(jq '.assets | length' <<<"$release")" -eq 24

          mismatches=()
          for attempt in {1..12}; do
            mismatches=()
            for package in "${packages[@]}"; do
              actual=$(timeout --signal=TERM --kill-after=5s 30s \
                npm view "${package}@latest" version \
                  --registry=https://registry.npmjs.org \
                  --prefer-online 2>/dev/null || true)
              [[ "$actual" == "$version" ]] || mismatches+=("$package=${actual:-missing}")
            done
            (( ${#mismatches[@]} == 0 )) && break
            if (( attempt < 12 )); then
              sleep 10
            fi
          done
          if (( ${#mismatches[@]} > 0 )); then
            printf '::error::npm latest did not converge to %s: %s\n' \
              "$version" "${mismatches[*]}"
            exit 1
          fi

          deployment_id=$(timeout --signal=TERM --kill-after=5s 30s \
            gh api \
              "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=20" \
              --jq "map(select(.sha == \"$GITHUB_SHA\")) | first | .id // empty")
          test -n "$deployment_id" || {
            echo "::error::no github-pages deployment was recorded for $GITHUB_SHA"
            exit 1
          }
          deployment_state=$(timeout --signal=TERM --kill-after=5s 30s \
            gh api \
              "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
              --jq '.[0].state')
          test "$deployment_state" = "success" || {
            echo "::error::github-pages deployment $deployment_id is $deployment_state"
            exit 1
          }

          for path in '' 'changelog/'; do
            visible=false
            for attempt in {1..12}; do
              page=$(curl --fail --location --silent --show-error \
                --retry 3 --retry-delay 2 --retry-all-errors \
                --connect-timeout 20 --max-time 60 --retry-max-time 60 \
                --max-redirs 5 --max-filesize 5242880 \
                --proto '=https' --proto-redir '=https' \
                "https://umadev.goder.ai/$path" || true)
              if grep -Fq "$version" <<<"$page"; then
                visible=true
                break
              fi
              if (( attempt < 12 )); then
                sleep 10
              fi
            done
            [[ "$visible" == true ]] || {
              echo "::error::the public website path /$path does not show $version"
              exit 1
            }
          done

          for installer in install.sh install.ps1; do
            visible=false
            for attempt in {1..12}; do
              installer_body=$(curl --fail --location --silent --show-error \
                --retry 3 --retry-delay 2 --retry-all-errors \
                --connect-timeout 20 --max-time 60 --retry-max-time 60 \
                --max-redirs 5 --max-filesize 1048576 \
                --proto '=https' --proto-redir '=https' \
                "https://umadev.goder.ai/$installer" || true)
              if grep -Fq 'umacloud/umadev' <<<"$installer_body" \
                && grep -Fq 'UMADEV_INSTALL_DIR' <<<"$installer_body"; then
                visible=true
                break
              fi
              if (( attempt < 12 )); then
                sleep 10
              fi
            done
            [[ "$visible" == true ]] || {
              echo "::error::the public website is missing the $installer native installer"
              exit 1
            }
          done
